name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Accepté en variable OU en secret de dépôt. Le nom d'image n'est jamais passé
  # en sortie de job (GitHub y supprime les valeurs issues de secrets) :
  # chaque job le recalcule à partir du SHA.
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
  APP_PORT: 3898

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      # LayoutProps / PageProps sont générés dans .next/types
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  image:
    name: Build & push to Docker Hub
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub config
        env:
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Variable de dépôt DOCKERHUB_USERNAME manquant (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN manquant"
            exit 1
          fi

      - name: Image tag
        run: |
          name="docker.io/${DOCKERHUB_USERNAME,,}/portfolio-konan"
          echo "IMAGE=$name:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=$name:latest" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://abrahamkonany.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Image tag
        run: echo "IMAGE=docker.io/${DOCKERHUB_USERNAME,,}/portfolio-konan:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Pull & restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_PORT: ${{ env.APP_PORT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DEPLOY_PATH,APP_PORT
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            printf 'IMAGE=%s\nAPP_PORT=%s\n' "$IMAGE" "$APP_PORT" > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker logout
            docker image prune -f

            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/"; then
                echo "Déployé : $IMAGE sur le port $APP_PORT"
                exit 0
              fi
              sleep 3
            done
            echo "Le conteneur ne répond pas" >&2
            docker compose logs --tail=50
            exit 1
