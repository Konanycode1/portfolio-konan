# Copié sur le VPS par le workflow GitHub Actions (dans $DEPLOY_PATH).
# IMAGE et PROXY_NETWORK sont écrits dans .env par le workflow,
# ex. IMAGE=docker.io/<user>/portfolio-konan:<sha>
services:
  portfolio:
    image: ${IMAGE:-docker.io/owner/portfolio-konan:latest}
    container_name: portfolio-konan
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Nginx (conteneur) joint le site via http://portfolio-konan:3898 sur le réseau partagé.
    # Le port local sert au healthcheck du workflow et au debug sur le VPS.
    ports:
      - "127.0.0.1:3898:3898"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-networkings}
