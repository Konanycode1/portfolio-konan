# Copié sur le VPS par le workflow GitHub Actions (dans $DEPLOY_PATH).
# IMAGE et APP_PORT sont écrits dans .env par le workflow,
# ex. IMAGE=docker.io/<user>/portfolio-konan:<sha>
services:
  portfolio:
    image: ${IMAGE:-docker.io/owner/portfolio-konan:latest}
    container_name: portfolio-konan
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Exposé uniquement en local : Nginx ou Traefik fait le reverse proxy + HTTPS
    ports:
      - "127.0.0.1:${APP_PORT:-3898}:3000"
